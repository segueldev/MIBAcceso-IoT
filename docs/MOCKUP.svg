<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="490" viewBox="0 0 1320 490"><rect width="1320" height="490" fill="#edf2f7"/><text x="30" y="40" font-family="sans-serif" font-size="24" fill="#102a43">MIB Acceso · Mockup de navegación</text><rect x="25" y="75" width="235" height="335" rx="22" fill="#102a43"/><text x="41" y="118" font-family="sans-serif" font-size="19" fill="white">1 Login</text><rect x="37" y="145" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="45" y="172" font-family="sans-serif" font-size="14" fill="#102a43">Usuario</text><rect x="37" y="200" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="45" y="227" font-family="sans-serif" font-size="14" fill="#102a43">Contraseña ••••••••</text><rect x="37" y="255" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="45" y="282" font-family="sans-serif" font-size="14" fill="#102a43">Crear / Ingresar</text><rect x="37" y="310" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="45" y="337" font-family="sans-serif" font-size="14" fill="#102a43">Error o bloqueo 60 s</text><rect x="285" y="75" width="235" height="335" rx="22" fill="#102a43"/><text x="301" y="118" font-family="sans-serif" font-size="19" fill="white">2 Conexión</text><rect x="297" y="145" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="305" y="172" font-family="sans-serif" font-size="14" fill="#102a43">Rol: Base / Agente</text><rect x="297" y="200" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="305" y="227" font-family="sans-serif" font-size="14" fill="#102a43">IP de Base: 192.168.x.x</text><rect x="297" y="255" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="305" y="282" font-family="sans-serif" font-size="14" fill="#102a43">Código de misión ••••</text><rect x="297" y="310" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="305" y="337" font-family="sans-serif" font-size="14" fill="#102a43">Iniciar / Conectar</text><rect x="545" y="75" width="235" height="335" rx="22" fill="#102a43"/><text x="561" y="118" font-family="sans-serif" font-size="19" fill="white">3 Monitoreo</text><rect x="557" y="145" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="565" y="172" font-family="sans-serif" font-size="14" fill="#102a43">Canal verificado</text><rect x="557" y="200" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="565" y="227" font-family="sans-serif" font-size="14" fill="#102a43">Puerta: cerrada</text><rect x="557" y="255" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="565" y="282" font-family="sans-serif" font-size="14" fill="#102a43">Presencia: sí / no</text><rect x="557" y="310" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="565" y="337" font-family="sans-serif" font-size="14" fill="#102a43">Última telemetría</text><rect x="805" y="75" width="235" height="335" rx="22" fill="#102a43"/><text x="821" y="118" font-family="sans-serif" font-size="19" fill="white">4 Activador</text><rect x="817" y="145" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="825" y="172" font-family="sans-serif" font-size="14" fill="#102a43">Base: presencia y mant.</text><rect x="817" y="200" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="825" y="227" font-family="sans-serif" font-size="14" fill="#102a43">Agente: elegir sector</text><rect x="817" y="255" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="825" y="282" font-family="sans-serif" font-size="14" fill="#102a43">Duración: 1–10 segundos</text><rect x="817" y="310" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="825" y="337" font-family="sans-serif" font-size="14" fill="#102a43">Solicitar / Confirmación</text><rect x="1065" y="75" width="235" height="335" rx="22" fill="#102a43"/><text x="1081" y="118" font-family="sans-serif" font-size="19" fill="white">5 Bitácora</text><rect x="1077" y="145" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="1085" y="172" font-family="sans-serif" font-size="14" fill="#102a43">Fecha y evento</text><rect x="1077" y="200" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="1085" y="227" font-family="sans-serif" font-size="14" fill="#102a43">Solicitud e ID</text><rect x="1077" y="255" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="1085" y="282" font-family="sans-serif" font-size="14" fill="#102a43">RTT de confirmación</text><rect x="1077" y="310" width="211" height="43" rx="7" fill="#e3f2ef"/><text x="1085" y="337" font-family="sans-serif" font-size="14" fill="#102a43">Exportar CSV</text><text x="30" y="452" font-family="sans-serif" font-size="17">Login → panel autenticado → navegación entre Conexión, Monitoreo, Activador y Bitácora → Cerrar sesión</text></svg>